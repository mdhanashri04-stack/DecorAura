<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Catalogue - Decor Aura Luxury Decor</title>
  <meta name="description" content="Browse Decor Aura's full catalogue of sculptural lighting, modern furniture, wall decor, and home accessories.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/shop.css">
</head>
<body>

  <!-- Header -->
  <header class="header scrolled">
    <div class="container header-container">
      <a href="/index.html" class="brand-logo">
        DecorAura
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/shop.html" class="nav-link active">Shop</a></li>
          <li><a href="/index.html#collections" class="nav-link">Collections</a></li>
          <li><a href="/index.html#inspiration" class="nav-link">Inspiration</a></li>
          <li><a href="/blog.html" class="nav-link">Journal</a></li>
          <li><a href="/about.html" class="nav-link">About</a></li>
          <li><a href="/contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <a href="/cart.html" class="icon-btn" aria-label="Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Page Banner -->
  <div style="background-color: var(--bg-secondary); padding: 7rem 0 3rem 0; text-align: center; border-bottom: 1px solid var(--border-subtle);">
    <div class="container">
      <span class="subheading">Masterpiece Collection</span>
      <h1 class="heading-lg">Catalogue</h1>
      <p style="color: var(--text-secondary); max-width: 500px; margin: 0.5rem auto 0 auto;">
        Sculptural lighting, elevated furniture, and tactile home accessories.
      </p>
    </div>
  </div>

  <!-- Shop Main Section -->
  <main class="container">
    <div class="shop-layout">
      <!-- Sidebar Filters -->
      <aside class="shop-sidebar">
        <div class="filter-group">
          <h3 class="filter-title">Categories</h3>
          <ul class="filter-list" id="category-filter-list">
            <li class="filter-item">
              <label><input type="radio" name="category" value="" checked> All Products</label>
            </li>
            <li class="filter-item">
              <label><input type="radio" name="category" value="lighting"> Lighting</label>
            </li>
            <li class="filter-item">
              <label><input type="radio" name="category" value="furniture"> Furniture</label>
            </li>
            <li class="filter-item">
              <label><input type="radio" name="category" value="wall-decor"> Wall Decor</label>
            </li>
            <li class="filter-item">
              <label><input type="radio" name="category" value="plants-planters"> Plants & Planters</label>
            </li>
            <li class="filter-item">
              <label><input type="radio" name="category" value="accessories"> Accessories</label>
            </li>
          </ul>
        </div>

        <div class="filter-group">
          <h3 class="filter-title">Max Price</h3>
          <div class="price-range">
            <input type="range" id="price-slider" min="50" max="2500" step="50" value="2500">
            <div class="price-values">
              <span>$50</span>
              <span id="price-value-display">$2,500</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Shop Content Area -->
      <section>
        <div class="shop-toolbar">
          <div class="results-count" id="results-count">Loading products...</div>

          <div class="shop-controls">
            <div class="search-input-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="search-input" placeholder="Search catalogue...">
            </div>

            <select id="sort-select" class="sort-select">
              <option value="">Sort by: Featured</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
              <option value="newest">Newest Additions</option>
            </select>
          </div>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="shop-products-grid">
          <!-- Dynamically loaded -->
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <p>&copy; 2026 Decor Aura. All rights reserved.</p>
    </div>
  </footer>

  <script type="module">
    import { API } from '/js/api.js';
    import { Cart } from '/js/cart.js';
    import '/js/main.js';

    let currentProducts = [];

    async function loadShopProducts() {
      const selectedCategory = document.querySelector('input[name="category"]:checked')?.value || '';
      const maxPrice = document.getElementById('price-slider').value;
      const search = document.getElementById('search-input').value;
      const sortBy = document.getElementById('sort-select').value;

      const params = {};
      if (selectedCategory) params.category_slug = selectedCategory;
      if (maxPrice) params.max_price = maxPrice;
      if (search) params.search = search;
      if (sortBy) params.sort_by = sortBy;

      const grid = document.getElementById('shop-products-grid');
      const countEl = document.getElementById('results-count');

      grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 3rem;">Loading Decor Aura products...</p>';

      currentProducts = await API.getProducts(params);
      countEl.textContent = `Showing ${currentProducts.length} items`;

      if (currentProducts.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-secondary);">No products match your filter criteria.</p>';
        return;
      }

      grid.innerHTML = currentProducts.map(p => `
        <div class="product-card">
          <div class="product-card-image">
            ${p.is_3d_enabled ? '<span class="product-badge product-badge-3d">3D Viewer</span>' : ''}
            <img src="${p.primary_image}" alt="${p.name}">
          </div>
          <div class="product-card-body">
            <span class="product-category">${p.category ? p.category.name : 'Decor'}</span>
            <h3 class="product-title"><a href="/product.html?slug=${p.slug}">${p.name}</a></h3>
            <div class="product-rating">
              <i class="fa-solid fa-star"></i>
              <span>${p.rating.toFixed(1)} (${p.reviews_count})</span>
            </div>
            <div class="product-footer">
              <div class="product-price">$${p.price.toFixed(2)}</div>
              <button class="add-cart-btn" data-id="${p.id}" aria-label="Add to cart">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.add-cart-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          const prod = currentProducts.find(p => p.id == id);
          if (prod) Cart.addItem(prod, 1);
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Check query string parameters for initial state
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get('category');
      if (catParam) {
        const radio = document.querySelector(`input[name="category"][value="${catParam}"]`);
        if (radio) radio.checked = true;
      }

      loadShopProducts();

      // Filter events
      document.querySelectorAll('input[name="category"]').forEach(r => r.addEventListener('change', loadShopProducts));
      
      const slider = document.getElementById('price-slider');
      slider.addEventListener('input', (e) => {
        document.getElementById('price-value-display').textContent = `$${parseInt(e.target.value).toLocaleString()}`;
      });
      slider.addEventListener('change', loadShopProducts);

      document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(window.searchTimer);
        window.searchTimer = setTimeout(loadShopProducts, 400);
      });

      document.getElementById('sort-select').addEventListener('change', loadShopProducts);
    });
  </script>
</body>
</html>
