<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decor Aura Journal - Interior Architecture & Lighting Design</title>
  <meta name="description" content="Read expert interior design articles, lighting guides, spatial advice, and modern home trends on Decor Aura Journal.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/shop.css">
</head>
<body>

  <!-- Header -->
  <header class="header scrolled">
    <div class="container header-container">
      <a href="/index.html" class="brand-logo">
        DecorAura
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/shop.html" class="nav-link">Shop</a></li>
          <li><a href="/index.html#collections" class="nav-link">Collections</a></li>
          <li><a href="/index.html#inspiration" class="nav-link">Inspiration</a></li>
          <li><a href="/blog.html" class="nav-link active">Journal</a></li>
          <li><a href="/about.html" class="nav-link">About</a></li>
          <li><a href="/contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <a href="/cart.html" class="icon-btn" aria-label="Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Banner -->
  <div style="background-color: var(--bg-secondary); padding: 7rem 0 3.5rem 0; text-align: center; border-bottom: 1px solid var(--border-subtle);">
    <div class="container">
      <span class="subheading">Editorial Publication</span>
      <h1 class="heading-lg">Decor Aura Journal</h1>
      <p style="color: var(--text-secondary); max-width: 540px; margin: 0.5rem auto 0 auto;">
        Perspectives on lighting architecture, spatial harmony, and material craftsmanship.
      </p>
    </div>
  </div>

  <!-- Blog Grid -->
  <main class="container section">
    <div class="blog-grid" id="blog-articles-grid">
      <!-- Dynamically loaded articles -->
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <p>&copy; 2026 Decor Aura. All rights reserved.</p>
    </div>
  </footer>

  <script type="module">
    import { API } from '/js/api.js';
    import '/js/main.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const articles = await API.getBlogs();
      const grid = document.getElementById('blog-articles-grid');

      if (grid && articles.length > 0) {
        grid.innerHTML = articles.map(b => `
          <article class="blog-card">
            <div class="blog-card-image">
              <img src="${b.featured_image}" alt="${b.title}">
            </div>
            <div class="blog-card-body">
              <div class="blog-meta">
                <span class="category">${b.category ? b.category.name : 'Journal'}</span>
                <span>• ${b.reading_time}</span>
              </div>
              <h3><a href="#" onclick="alert('Displaying article: ${b.title}'); return false;">${b.title}</a></h3>
              <p>${b.excerpt}</p>
            </div>
          </article>
        `).join('');
      }
    });
  </script>
</body>
</html>
